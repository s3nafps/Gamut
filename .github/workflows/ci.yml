name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gamut_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check-i18n -w @gamut/web
      - name: Tests (embedded database)
        run: npm test
      - name: Tests (real PostgreSQL)
        run: npm run test -w @gamut/server
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/gamut_test
      - run: npm run build
      - run: npm run check -w @gamut/desktop
